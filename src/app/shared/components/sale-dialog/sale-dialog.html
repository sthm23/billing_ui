<p-dialog header="Update price" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }"
  (visibleChange)="closeModal($event)">

  <form class="flex flex-col gap-4" [formGroup]="form">
    <div class="flex items-center gap-4 mb-4 ">
      <p-selectbutton [options]="stateOptions" formControlName="value" optionLabel="label" optionValue="value"
        aria-labelledby="basic">
        <ng-template #item let-item>
          <i [class]="item.icon" [style]="item.color"></i>
          <span>{{item.label}}</span>
        </ng-template>
      </p-selectbutton>
    </div>
    <div class="flex items-center gap-4">
      <p-inputgroup>
        <p-inputnumber placeholder="Price" formControlName="currentSale" [invalid]="error" />
        <p-inputgroup-addon>
          <i class="pi pi-money-bill"></i>
        </p-inputgroup-addon>
      </p-inputgroup>

    </div>
    @if(error) {
    <small class="text-red-500">{{error}}</small>
    }
    <div class="flex items-center gap-4 mb-4 mt-4">
      <div>
      </div>
      <div class="flex flex-row items-center gap-3">
        <small>Price:</small>
        <h5 [ngClass]="{'sale': currentSale > 0 }">{{price | currency: ' ' : 'code' : '0.0'}}</h5>
        @if(newPrice) {
        <small>New price:</small>
        <h5>{{newPrice | currency: ' ' : 'code' : '0.0'}}
        </h5>
        }
      </div>

    </div>
    <div class="flex justify-end gap-2">
      <p-button label="Cancel" severity="secondary" (click)="closeModal(false)" />
      <p-button label="Save" (click)="save()" />
    </div>
  </form>
</p-dialog>
