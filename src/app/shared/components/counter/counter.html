<p-inputnumber [showButtons]="true" buttonLayout="horizontal" inputId="horizontal" spinnerMode="horizontal" [step]="1"
  [(ngModel)]="count" [max]="maxValue" [min]="0" (onInput)="handleChange()" (onBlur)="handleChange()"
  [suffix]="' / ' + maxValue" [inputSize]="8">
  <ng-template #incrementbuttonicon>
    <span class="pi pi-plus"></span>
  </ng-template>
  <ng-template #decrementbuttonicon>
    <span class="pi pi-minus"></span>
  </ng-template>
</p-inputnumber>
