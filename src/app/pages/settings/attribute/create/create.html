<p-dialog [header]="'order.create'| transloco" contentStyleClass="h-60" [modal]="true" [(visible)]="visible"
  [style]="{ width: '25rem' }" (visibleChange)="visibleChange.emit($event)">
  <form [formGroup]="form">
    <div class="flex items-center gap-4 mb-4">
      <label for="username" class="font-semibold w-24">{{'product.name' | transloco}}</label>
      <input pInputText id="username" class="flex-auto" autocomplete="off" formControlName="name"
        [class]="isValid('name')" />
    </div>
    <div class="flex items-center gap-4 mb-8">
      <label for="type" class="font-semibold w-24">{{'user.type' | transloco}}</label>
      <p-select id="type" class="flex-auto" [options]="attributeType" optionLabel="label" optionValue="value"
        formControlName="type" [class]="isValid('type')" />
    </div>
    <div class="flex justify-end gap-2">
      <p-button [label]="'product.cancel' | transloco" severity="secondary" (click)="hideDialog()" />
      <p-button [label]="'order.save' | transloco" (click)="submit()" />
    </div>
  </form>
</p-dialog>
